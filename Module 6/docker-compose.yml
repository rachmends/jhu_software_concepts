services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gradcafe
      POSTGRES_USER: gradcafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradcafe -d gradcafe"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: gradcafe
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: gradcafe
      DB_USER: gradcafe
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-gradcafe}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F"
      RABBITMQ_USER: gradcafe
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: src/worker/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: gradcafe
      DB_USER: gradcafe
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-gradcafe}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F"
      RABBITMQ_USER: gradcafe
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      DATA_DIR: /app/data
    volumes:
      - ./src/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
